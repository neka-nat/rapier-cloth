[workspace]
members = ["crates/rapier-cloth-core"]
exclude = ["tests/consumers/f32", "tests/consumers/f64"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/neka-nat/rapier-cloth"

[package]
name = "rapier-cloth"
description = "CPU XPBD cloth simulation with Rapier 3D integration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
include = ["src/**", "examples/**", "benches/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE-*", "docs/*.md", "CHANGELOG.md"]

[features]
default = ["f32"]
f32 = ["dep:rapier-f32", "rapier-cloth-core/f32"]
f64 = ["dep:rapier-f64", "rapier-cloth-core/f64"]

[dependencies]
rapier-cloth-core = { version = "0.1.0", path = "crates/rapier-cloth-core", default-features = false }
rapier-f32 = { package = "rapier3d", version = "0.34", optional = true }
rapier-f64 = { package = "rapier3d-f64", version = "0.34", optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.test]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2

[[bench]]
name = "cloth_scaling"
harness = false
