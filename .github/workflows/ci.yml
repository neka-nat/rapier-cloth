name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  docs-examples:
    name: Documentation and examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: docs-examples
      - run: python3 scripts/check-docs.py
      - run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: bash scripts/check-examples.sh
  rust:
    name: Rust ${{ matrix.os }} ${{ matrix.precision }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        precision: [f32, f64]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.precision }}
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p rapier-cloth-core --no-default-features --features ${{ matrix.precision }}
      - run: cargo test --locked -p rapier-cloth --no-default-features --features ${{ matrix.precision }}
      - run: cargo clippy --locked -p rapier-cloth-core --no-default-features --features ${{ matrix.precision }} --all-targets -- -D warnings
      - run: cargo clippy --locked -p rapier-cloth --no-default-features --features ${{ matrix.precision }} --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path tests/consumers/${{ matrix.precision }}/Cargo.toml
  features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/check-features.sh
      - name: Core dependency boundary
        shell: bash
        run: |
          cargo tree --locked -p rapier-cloth-core --edges normal > core-dependencies.txt
          if grep -E 'rapier3d|parry3d|bevy|wgpu|three' core-dependencies.txt; then exit 1; fi
  msrv:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        precision: [f32, f64]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-${{ matrix.precision }}
      - run: cargo +1.90.0 check --locked -p rapier-cloth --no-default-features --features ${{ matrix.precision }}

  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: viewer
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demos/viewer/package-lock.json
      - run: cargo run --locked --release --no-default-features --features f64 --example pick_and_place -- --record target/ci-viewer/f64.json --summary target/ci-viewer/summary.json
      - run: cp target/ci-viewer/f64.json demos/viewer/public/sample-f64.json
      - run: npm --prefix demos/viewer ci
      - run: npx playwright install --with-deps chromium
        working-directory: demos/viewer
      - run: npm --prefix demos/viewer run build
      - run: npm --prefix demos/viewer run test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viewer-recording-and-browser-evidence
          path: |
            target/ci-viewer/
            demos/viewer/test-results/
  live:
    name: Live demo ${{ matrix.precision }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        precision: [f32, f64]
    env:
      CLOTH_LIVE_PRECISION: ${{ matrix.precision }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: demos/live-server -> target
          key: live-${{ matrix.precision }}
      - run: cargo fmt --manifest-path demos/live-server/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path demos/live-server/Cargo.toml --no-default-features --features ${{ matrix.precision }}
      - run: cargo clippy --locked --manifest-path demos/live-server/Cargo.toml --no-default-features --features ${{ matrix.precision }} --all-targets -- -D warnings
      - run: cargo build --locked --release --manifest-path demos/live-server/Cargo.toml --no-default-features --features ${{ matrix.precision }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demos/viewer/package-lock.json
      - run: npm --prefix demos/viewer ci
      - run: npx playwright install --with-deps chromium
        working-directory: demos/viewer
      - run: npm --prefix demos/viewer run test:live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-demo-${{ matrix.precision }}
          path: demos/viewer/test-results/

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: packages
      - run: bash scripts/check-packages.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crate-archives-and-consumer-evidence
          path: |
            /tmp/rapier-cloth-package-*/target-*/package/*.crate
            /tmp/rapier-cloth-package-*/*contents.txt
            /tmp/rapier-cloth-package-*/metadata-*.json
            /tmp/rapier-cloth-package-*/SHA256SUMS
